name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  audit:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - name: Tap this checkout
        run: |
          mkdir -p "$(brew --repository)/Library/Taps/binary-companion"
          ln -s "$PWD" "$(brew --repository)/Library/Taps/binary-companion/homebrew-tap"
      - name: Style
        run: brew style --cask binary-companion/tap
      - name: Audit
        env:
          HOMEBREW_GITHUB_API_TOKEN: ${{ github.token }}
        run: |
          for f in Casks/*.rb; do
            brew audit --cask --online --strict "binary-companion/tap/$(basename "$f" .rb)"
          done
